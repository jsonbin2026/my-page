.skeleton-btn{height:76px;border-radius:18px}
.detail-card{max-width:400px;width:100%;max-height:88vh;overflow-y:auto;background:rgba(18,16,14,0.97);backdrop-filter:blur(40px);border-radius:28px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 50px 150px rgba(0,0,0,0.75);animation:zoomIn 0.4s cubic-bezier(0.16,1,0.3,1);position:relative}
.detail-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:none;color:var(--text-secondary);font-size:15px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
.detail-close:hover{background:rgba(255,255,255,0.12);color:var(--text-primary)}
.detail-hero{width:100%;height:240px;object-fit:cover;border-radius:28px 28px 0 0;background:#0a0806;display:block}
.detail-hero-wrap{position:relative;width:100%;min-height:240px;border-radius:28px 28px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.10),#0a0806 70%);display:flex;align-items:center;justify-content:center}
.detail-hero-wrap i.hero-icon{font-size:110px;color:var(--accent-light);filter:drop-shadow(0 0 40px rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.35))}
.detail-hero-wrap video{width:100%;height:240px;object-fit:cover;display:block}
.detail-body{padding:22px 22px 26px}
.detail-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#f5efe6,var(--accent-light) 45%,var(--accent-lighter));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Playfair Display',serif;line-height:1.1}
.detail-subtitle{font-size:14px;color:var(--accent-light);margin-top:2px;font-weight:600}
.detail-desc{font-size:13px;line-height:1.85;color:var(--text-secondary);padding:14px 16px;background:rgba(0,0,0,0.25);border-radius:14px;border:1px solid rgba(255,255,255,0.04);margin-top:10px}
.detail-desc strong{color:var(--accent-lighter)}
.detail-section-title{font-size:13px;font-weight:800;color:var(--accent-light);margin:20px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:0.5px}
.detail-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.detail-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);color:var(--text-primary);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;transition:0.3s;text-align:center}
.detail-btn:hover{background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.08);border-color:rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.24);transform:translateY(-2px)}
.detail-btn.primary{background:linear-gradient(135deg,var(--accent-dark),var(--accent-light));color:#1a1510;border:none}
.detail-btn i{font-size:15px}
.changelog-list{display:flex;flex-direction:column;gap:10px}
.changelog-item{padding:12px 14px;background:rgba(255,255,255,0.02);border-left:3px solid var(--accent-light);border-radius:8px}
.changelog-ver{font-size:12px;font-weight:800;color:var(--accent-lighter);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.changelog-date{font-size:10px;color:var(--text-muted);font-weight:400}
.changelog-notes{font-size:12px;color:var(--text-secondary);line-height:1.7;margin-top:6px;white-space:pre-wrap}
.changelog-edit-item{display:flex;gap:6px;padding:8px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid rgba(255,255,255,0.04);flex-wrap:wrap;align-items:flex-start}
.changelog-edit-item input,.changelog-edit-item textarea{padding:5px 8px;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text-primary);font-size:11px;outline:none;font-family:inherit}
.changelog-edit-item .ch-ver{width:70px}
.changelog-edit-item .ch-date{width:110px}
.changelog-edit-item .ch-notes{flex:1;min-width:120px;min-height:44px;border-radius:8px;resize:vertical}
.changelog-edit-item .ch-del{padding:5px 10px;background:rgba(255,70,70,0.06);border:none;border-radius:6px;color:#ff7a7a;cursor:pointer;font-size:11px}
.countdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(20px);display:none;justify-content:center;align-items:center;z-index:999998;padding:20px}
.countdown-overlay.active{display:flex;animation:fadeIn 0.3s ease}
.countdown-card{max-width:300px;width:100%;padding:32px 24px;background:rgba(18,16,14,0.97);border-radius:24px;border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.18);text-align:center;animation:zoomIn 0.35s cubic-bezier(0.16,1,0.3,1)}
.countdown-num{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--accent-light),var(--accent-lighter));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;font-family:'Playfair Display',serif;animation:cdPulse 1s ease-in-out infinite}
@keyframes cdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.countdown-title{font-size:15px;color:var(--text-primary);font-weight:700;margin-bottom:6px}
.countdown-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.countdown-cancel{padding:9px 24px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);border-radius:999px;color:var(--text-muted);font-size:12px;cursor:pointer;font-weight:600}
.theme-toggle{position:fixed;top:16px;right:16px;z-index:9999;width:40px;height:40px;border-radius:50%;background:rgba(18,16,14,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);color:var(--accent-light);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,0.5);transition:0.3s}
.theme-toggle:hover{transform:scale(1.08);background:rgba(18,16,14,0.95)}
body.light-theme .theme-toggle{background:rgba(255,255,255,0.9);color:#8a6a10}
@media(max-width:440px){
  .app-wrapper{padding:8px 8px 12px!important}
  .project-card{padding:13px 11px 12px!important}
  .card-name-tier1{font-size:26px!important}
  .card-name-tier2{font-size:14px!important;letter-spacing:3px!important}

  .card-big-icon{width:62px!important;height:62px!important}

  .action-card{padding:7px 3px!important;min-height:52px!important}
  .project-nav .nav-item{padding:4px 7px!important;gap:4px!important}
  .project-nav .nav-item span{font-size:10px!important}
  .detail-hero-wrap{min-height:200px}
  .detail-title{font-size:26px}
}
@media(max-width:640px){:root{--blur-size:12px}}

App.PwdCrypto={

  _randSalt:function(len){len=len||16;var arr=new Uint8Array(len);crypto.getRandomValues(arr);return btoa(String.fromCharCode.apply(null,arr))},
  _b64ToBytes:function(b64){var bin=atob(b64);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr},
  _bytesToB64:function(bytes){var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin)},
  derive:async function(password,saltB64,iter){
    iter=iter||this.ITER;
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:this._b64ToBytes(saltB64),iterations:iter,hash:'SHA-256'},km,256);

  hash:async function(password,salt,iter){iter=iter||this.ITER;salt=salt||this._randSalt();var h=await this.derive(password,salt,iter);return 'pbkdf2$'+iter+'$'+salt+'$'+h},
  verify:async function(password,stored){
    if(!stored)return {ok:false};
    if(stored.indexOf('pbkdf2$')===0){
      var p=stored.split('$');var iter=parseInt(p[1],10);var salt=p[2];var expect=p[3];
      var got=await this.derive(password,salt,iter);
      return {ok:got===expect};
    }
    var sha=App.sha256(password);
    if(sha===stored){var nh=await this.hash(password);return {ok:true,upgraded:true,newHash:nh}}
    return {ok:false};
  }
};

App.sha256=function(ascii){

var comp={};
for(var c=2;pc<64;c++){
if(!comp[c]){
for(i=0;i<313;i+=c)comp[i]=c;
h[pc]=(mp(c,0.5)*mw)|0;
k[pc++]=(mp(c,1/3)*mw)|0;
}
}
ascii+='\x80';
while(ascii[lp]%64-56)ascii+='\x00';
for(i=0;i<ascii[lp];i++){j=ascii.charCodeAt(i);if(j>>8)return '';w[i>>2]|=j<<((3-i)%4)*8}
w[w[lp]]=((bl/mw)|0);
w[w[lp]]=(bl);
for(j=0;j<w[lp];){

h=h.slice(0,8);
for(i=0;i<64;i++){
var w15=ww[i-15],w2=ww[i-2],a=h[0],e=h[4];
var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(ww[i]=(i<16)?ww[i]:(ww[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ww[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
h=[(t1+t2)|0].concat(h);
h[4]=(h[4]+t1)|0;
}
for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;
}

const DB_NAME='yz_admin_db',DB_VERSION=1;

App.openDB=function(){

if(!window.indexedDB){dbAvailable=false;resolve(null);return}
try{
var req=indexedDB.open(DB_NAME,DB_VERSION);
req.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('images'))d.createObjectStore('images');if(!d.objectStoreNames.contains('videos'))d.createObjectStore('videos');if(!d.objectStoreNames.contains('navIcons'))d.createObjectStore('navIcons')};

req.onerror=function(){dbAvailable=false;resolve(null)};
}catch(e){dbAvailable=false;resolve(null)}
});
};
App._lsKey=function(s,k){return 'yz_db_'+s+'_'+k};
const LS_MIRROR_LIMIT=50000;
App.getFromDB=async function(s,k){
  try{var v=localStorage.getItem(App._lsKey(s,k));if(v!==null&&v!=='')return v}catch(e){}
  if(!dbAvailable||!db)return memoryStore.get(s+'_'+k)||'';
  return new Promise(function(resolve){
    try{var tx=db.transaction(s,'readonly');var rq=tx.objectStore(s).get(k);rq.onsuccess=function(){resolve(rq.result||'')};rq.onerror=function(){resolve('')};tx.onerror=function(){resolve('')}}catch(e){resolve('')}
  });
};
App.saveToDB=async function(s,k,v){
  var lsw=false;
  if(typeof v==='string'&&v.length<LS_MIRROR_LIMIT){try{localStorage.setItem(App._lsKey(s,k),v);lsw=true}catch(e){}}
  else{try{localStorage.removeItem(App._lsKey(s,k))}catch(e){}}
  if(!dbAvailable||!db){memoryStore.set(s+'_'+k,v);return lsw}
  return new Promise(function(resolve){
    try{var tx=db.transaction(s,'readwrite');tx.objectStore(s).put(v,k);tx.oncomplete=function(){resolve(true)};tx.onerror=function(){resolve(lsw)};tx.onabort=function(){resolve(lsw)}}catch(e){resolve(lsw)}
  });
};
App.deleteFromDB=async function(s,k){
  try{localStorage.removeItem(App._lsKey(s,k))}catch(e){}
  if(!dbAvailable||!db){memoryStore.delete(s+'_'+k);return}
  return new Promise(function(resolve){
    try{var tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=function(){resolve()};tx.onerror=function(){resolve()}}catch(e){resolve()}
  });
};
App.getAllFromStore=function(s){
  if(!dbAvailable||!db)return Promise.resolve({});

    try{
      var tx=db.transaction(s,'readonly');
      var rq=tx.objectStore(s).openCursor();
      var out={};
      rq.onsuccess=function(e){var c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else resolve(out)};
      rq.onerror=function(){resolve({})};
      tx.onerror=function(){resolve({})};
    }catch(e){resolve({})}
  });
};

App.getAllProjectsData=function(){
  var stored=App.Storage.get('allProjectsData',{});
  var merged=Object.assign({},defaultProjectsData);
  Object.keys(stored).forEach(function(k){merged[k]=Object.assign({},merged[k],stored[k])});
  Object.keys(merged).forEach(function(k){
    if(!merged[k].cardButtons||!Array.isArray(merged[k].cardButtons)||merged[k].cardButtons.length===0)merged[k].cardButtons=JSON.parse(JSON.stringify(DEFAULT_CARD_BUTTONS));
    if(!merged[k].features||!Array.isArray(merged[k].features))merged[k].features=JSON.parse(JSON.stringify(DEFAULT_FEATURES));

};

App.extractColorFromBg=function(){
  var bgImg=document.getElementById('noticeBox').style.backgroundImage;
  if(!bgImg||bgImg==='none'||bgImg==='')return;
  var url=bgImg.replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
  if(!url)return;
  var img=new Image();
  img.crossOrigin='Anonymous';
  img.onload=function(){
    try{
      var canvas=document.createElement('canvas');canvas.width=50;canvas.height=50;
      var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,50,50);
      var data=ctx.getImageData(0,0,50,50).data;
      var r=0,g=0,b=0,count=0;
      for(var i=0;i<data.length;i+=4){r+=data[i];g+=data[i+1];b+=data[i+2];count++}
      r=Math.round(r/count);g=Math.round(g/count);b=Math.round(b/count);
      var hex='#'+[r,g,b].map(function(c){return c.toString(16).padStart(2,'0')}).join('');
      document.documentElement.style.setProperty('--accent-glow','color-mix(in srgb, '+hex+', transparent 92%)');
    }catch(e){}
  };
  img.src=url;
};

let _countdownTimer=null,_countdownUrl='',_countdownProjectKey='';
App.startDownloadCountdown=function(url,pk){
  _countdownUrl=url;_countdownProjectKey=pk;
  var n=3;
  document.getElementById('countdownNum').textContent=n;
  elements.countdownOverlay.classList.add('active');
  clearInterval(_countdownTimer);
  _countdownTimer=setInterval(function(){
    n--;
    document.getElementById('countdownNum').textContent=Math.max(n,0);
    if(n<=0){
      clearInterval(_countdownTimer);
      elements.countdownOverlay.classList.remove('active');
      if(_countdownProjectKey)App.Stats.trackDownload(_countdownProjectKey);
      window.open(_countdownUrl,'_blank','noopener');
      _countdownUrl='';_countdownProjectKey='';
    }
  },1000);
};

App.openDetail=async function(key){
  var data=App.getProjectData(key);
  if(!data)return;
  var imageBase64=await App.getProjectImage(key);
  var videoBase64=await App.getProjectVideo(key);
  var bigIcon=await App.getBigIcon(key);
  var hasImage=imageBase64&&imageBase64!=='';
  var hasVideo=videoBase64&&videoBase64!=='';
  var hero;
  if(hasVideo)hero='<video src="'+videoBase64+'" controls autoplay muted loop playsinline></video>';
  else if(hasImage)hero='<img class="detail-hero" src="'+imageBase64+'" loading="lazy"/>';
  else if(bigIcon)hero='<img class="detail-hero" src="'+bigIcon+'" loading="lazy"/>';
  else hero='<i class="fas '+(data.icon||'fa-cube')+' hero-icon"></i>';
  var tagsHtml=(data.tags||[]).map(function(t){return '<span class="info-tag"><i class="fas fa-tag"></i>'+App.escapeHtml(t)+'</span>'}).join('');
  var infoHtml='<div class="project-info-row">'+(data.version?'<span class="info-tag"><i class="fas fa-code-branch"></i>'+App.escapeHtml(data.version)+'</span>':'')+(data.updateDate?'<span class="info-tag"><i class="fas fa-calendar"></i>'+App.escapeHtml(data.updateDate)+'</span>':'')+(data.fileSize?'<span class="info-tag"><i class="fas fa-weight-hanging"></i>'+App.escapeHtml(data.fileSize)+'</span>':'')+tagsHtml+'</div>';
  var buttons=App.getCardButtons(key).filter(function(b){return b.enabled!==false});
  var bhtml='<div class="detail-buttons">';
  buttons.forEach(function(b){
    var isDl=b.type==='download';
    bhtml+='<a href="'+App.escapeHtml(b.link||'#')+'" class="detail-btn'+(isDl?' primary':'')+'" data-btn-type="'+App.escapeHtml(b.type||'')+'" data-btn-id="'+App.escapeHtml(b.id||'')+'" target="_blank" rel="noopener">'+
    (b.customIcon?'<img src="'+b.customIcon+'" loading="lazy" style="width:16px;height:16px;border-radius:50%;"/>':'<i class="fas '+(b.icon||'fa-circle')+'"></i>')+
    App.escapeHtml(b.label||'按钮')+'</a>';
  });
  bhtml+='</div>';
  var features=App.getFeatures(key);
  var fhtml='';
  if(features.length){
    fhtml='<div class="detail-section-title"><i class="fas fa-list-check"></i> 功能介绍</div><div class="feature-list">';
    features.forEach(function(f){
      var fi=f.customIcon?'<img src="'+f.customIcon+'" loading="lazy"/>':'<i class="fas '+(f.icon||'fa-star')+'"></i>';
      fhtml+='<div class="feature-item" data-fid="'+(f.fid||'')+'"><div class="feature-icon">'+fi+'</div><div class="feature-body"><div class="feature-title">'+App.escapeHtml(f.title||'')+'</div><div class="feature-desc">'+App.escapeHtml(f.desc||'')+'</div></div></div>';
    });
    fhtml+='</div>';
  }
  var changelog=App.getChangelog(key);
  var chtml='';
  if(changelog.length){
    chtml='<div class="detail-section-title"><i class="fas fa-clock-rotate-left"></i> 更新日志</div><div class="changelog-list">';
    changelog.forEach(function(c){
      chtml+='<div class="changelog-item"><div class="changelog-ver"><span>'+App.escapeHtml(c.version||'')+'</span><span class="changelog-date">'+App.escapeHtml(c.date||'')+'</span></div><div class="changelog-notes">'+App.escapeHtml(c.notes||'')+'</div></div>';
    });
    chtml+='</div>';
  }
  var card=document.getElementById('detailCard');
  card.innerHTML='<button class="detail-close" id="detailCloseBtn"><i class="fas fa-times"></i></button><div class="detail-hero-wrap">'+hero+'</div><div class="detail-body"><div class="detail-title">'+App.escapeHtml(data.name)+'</div><div class="detail-subtitle">'+App.escapeHtml(data.subtitle||'')+'</div>'+infoHtml+'<div class="detail-desc">'+(data.desc||'暂无描述')+'</div><div class="detail-section-title"><i class="fas fa-download"></i> 相关按钮</div>'+bhtml+fhtml+chtml+'</div>';
  document.getElementById('detailCloseBtn').addEventListener('click',App.closeDetail);
  card.querySelectorAll('.detail-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){
      var href=btn.getAttribute('href');
      if(!href||href==='#'){e.preventDefault();App.showToast('⚠️ 该链接尚未设置');return}
      if(href.startsWith('http://')||href.startsWith('https://')){
        if(btn.dataset.btnType==='download'){e.preventDefault();App.startDownloadCountdown(href,key)}
      }else{e.preventDefault();App.showToast('⚠️ 链接格式无效')}
    });
  });
  card.querySelectorAll('.feature-item').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();var fid=this.dataset.fid;if(fid)App.openFeatureScreenshot(fid)});
  });
  elements.detailOverlay.classList.add('active');
  document.body.style.overflow='hidden';
};
App.closeDetail=function(){elements.detailOverlay.classList.remove('active');document.body.style.overflow=''};
document.getElementById('detailOverlay').addEventListener('click',function(e){if(e.target===this)App.closeDetail()});

  if(data.yzPopupImage!==undefined){yzPopupImage=data.yzPopupImage||'';if(data.yzPopupImage)await App.saveToDB('images','yz_popup',data.yzPopupImage);else await App.deleteFromDB('images','yz_popup');App.updateYZIcon();var yzRm=document.getElementById('yzRemoveBtn');if(yzRm)yzRm.style.display=(isAdminMode&&yzPopupImage)?'inline-flex':'none'}
  if(data.navIcons&&typeof data.navIcons==='object'){for(var k in data.navIcons){var v=data.navIcons[k];navIconCache[k]=v||'';if(v)await App.saveToDB('navIcons',k,v);else await App.deleteFromDB('navIcons',k)}}

  if(data.projectImages&&typeof data.projectImages==='object'){for(var k3 in data.projectImages){var v4=data.projectImages[k3];imageCache[k3]=v4||'';if(v4)await App.saveToDB('images',k3,v4);else await App.deleteFromDB('images',k3)}}
  if(data.projectVideos&&typeof data.projectVideos==='object'){for(var k4 in data.projectVideos){var v5=data.projectVideos[k4];videoCache[k4]=v5||'';if(v5)await App.saveToDB('videos',k4,v5);else await App.deleteFromDB('videos',k4)}}

/* =========================================================
   ★★★ 省 Supabase 额度核心：拆分上传
   核心（id=1）几 KB，图片（id=2）较大；只有变化的块才 PATCH
   ========================================================= */
App.uploadCloudData=async function(silent){
  silent=!!silent;
  if(!CLOUD_ENABLED){if(!silent)App.showToast('⚠️ 云同步未启用');return false}
  App.updateCloudStatus('syncing');
  try{
    // ① 核心配置：剥离所有图片字段
    var allRaw=JSON.parse(JSON.stringify(App.getAllProjectsData()));
    Object.keys(allRaw).forEach(function(k){
      delete allRaw[k].navIcon;delete allRaw[k].bigIcon;
      if(Array.isArray(allRaw[k].features))allRaw[k].features=allRaw[k].features.map(function(f){var o=Object.assign({},f);delete o.shotUrl;return o});
    });
    var coreData={
      allProjectsData:allRaw,
      projectOrder:projectOrder,
      brandName:App.getBrandName(),
      noticeContent:App.getNoticeContent(),
      shopContactLink:App.getShopLink(),
      downloadContactLink:App.getDownloadContactLink(),
      dynamicBgTheme:App.getDynamicBgClass(),
      cardTheme:App.getCardTheme(),
      customCss:localStorage.getItem('customCss')||'',
      brandLogo:localStorage.getItem('brandLogo')||'',
      announcementData:localStorage.getItem('announcementData')||'',
      colorMode:App.getColorMode()
    };

    // ② 图片 URL 表
    var imageData={
      announcementImage:await App.getAnnouncementImage()||'',
      noticeBg:await App.getNoticeBg()||'',
      projectAreaBg:await App.getProjectAreaBg()||'',
      yzPopupImage:yzPopupImage||'',
      navIcons:{},bigIcons:{},featureShots:{},projectImages:{},projectVideos:{}
    };
    var allKeys=Object.keys(App.getAllProjectsData());
    for(var i=0;i<allKeys.length;i++){
      var k=allKeys[i];
      imageData.navIcons[k]=navIconCache[k]||'';
      imageData.bigIcons[k]=bigIconCache[k]||'';
      imageData.projectImages[k]=imageCache[k]||'';
      imageData.projectVideos[k]=videoCache[k]||'';
      App.getFeatures(k).forEach(function(f){if(f.fid)imageData.featureShots[f.fid]=featureShotCache[f.fid]||''});
    }

    var nowIso=new Date().toISOString();
    var ver=parseInt(localStorage.getItem('cloud_version')||'0',10);
    var newVer=ver+1;

    // ③ 判断哪个块变了
    var coreHash=_simpleHash(JSON.stringify(coreData));
    var imageHash=_simpleHash(JSON.stringify(imageData));
    var lastCore=localStorage.getItem('cloud_core_hash')||'';
    var lastImage=localStorage.getItem('cloud_image_hash')||'';
    var needCore=coreHash!==lastCore;
    var needImage=imageHash!==lastImage;

    if(!needCore&&!needImage){
      App.updateCloudStatus('online');
      if(!silent)App.showToast('✅ 无变更，跳过同步');
      return true;
    }

    // ④ Edge Function（推荐）优先
    if(CLOUD_WRITE_ENDPOINT){
      var r=await fetch(CLOUD_WRITE_ENDPOINT,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:ADMIN_TOKEN,core:needCore?coreData:null,image:needImage?imageData:null,baseVersion:ver,updated_at:nowIso})
      });
      if(!r.ok){App.updateCloudStatus('offline');if(!silent)App.showToast('❌ 上传失败',r.status);return false}
      var rj=await r.json();
      if(rj&&rj.ok===false){App.updateCloudStatus('offline');if(!silent)App.showToast('❌ 版本冲突','请刷新后再改');return false}
      if(needCore)localStorage.setItem('cloud_core_hash',coreHash);
      if(needImage)localStorage.setItem('cloud_image_hash',imageHash);
      localStorage.setItem('cloud_version',String(newVer));
      localStorage.setItem('cloud_last_sync',String(Date.now()));
      localStorage.setItem('cloud_updated_at',nowIso);
      App.updateCloudStatus('online');
      if(!silent)App.showToast('✅ 云同步上传成功');
      return true;
    }

    // ⑤ 直连模式（⚠️ 生产建议走 Edge Function）
    var headers={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'};
    var rows=[];
    if(needCore)rows.push({id:1,data:coreData,updated_at:nowIso,version:newVer});
    if(needImage)rows.push({id:2,data:imageData,updated_at:nowIso,version:newVer});

    var response=await fetch(SUPABASE_URL+'/rest/v1/site_config',{method:'POST',headers:headers,body:JSON.stringify(rows)});
    if(!response.ok){App.updateCloudStatus('offline');if(!silent)App.showToast('❌ 上传失败','状态码：'+response.status);return false}

    if(needCore)localStorage.setItem('cloud_core_hash',coreHash);
    if(needImage)localStorage.setItem('cloud_image_hash',imageHash);
    localStorage.setItem('cloud_version',String(newVer));
    localStorage.setItem('cloud_last_sync',String(Date.now()));
    localStorage.setItem('cloud_updated_at',nowIso);
    App.updateCloudStatus('online');
    if(!silent)App.showToast('✅ 云同步上传成功','核心 '+(needCore?'✓':'—')+' · 图片 '+(needImage?'✓':'—'));
    return true;
  }catch(e){
    App.updateCloudStatus('offline');
    if(!silent)App.showToast('❌ 上传异常',e.message);
    return false;
  }
};

let _syncTimer=null;
App.scheduleSync=function(){
  if(!CLOUD_ENABLED)return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){
    // ★ 省额度：只有管理员改动才上传
    if(!isAdminMode){console.log('ℹ️ 非管理员跳过云端写入');return}
    App.uploadCloudData(true);
  },3000);
};

let _refreshTimer=null,_silentRefreshing=false;
App.silentRefresh=function(){
  clearTimeout(_refreshTimer);
  _refreshTimer=setTimeout(async function(){
    if(_silentRefreshing)return;
    _silentRefreshing=true;
    try{await App.loadCloudData(true)}catch(e){console.warn('静默刷新失败',e)}
    finally{_silentRefreshing=false}
  },1500);
};

App.loadCloudData=async function(silent){
  silent=!!silent;
  if(!CLOUD_ENABLED){if(!silent)App.showToast('⚠️ 云同步未启用');return false}
  if(!silent)App.updateCloudStatus('syncing');
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/site_config?id=in.(1,2)&select=id,data,updated_at,version',{
      cache:'no-store',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
    });
    if(!r.ok){if(!silent){App.updateCloudStatus('offline');App.showToast('❌ 拉取失败',r.status)}return false}
    var rows=await r.json();
    var coreRow=null,imageRow=null;
    rows.forEach(function(x){if(x.id===1)coreRow=x;if(x.id===2)imageRow=x});

    // 兼容老数据：只有 id=1 且里面包含图片字段
    if(coreRow&&coreRow.data&&coreRow.data.navIcons&&!imageRow){
      console.log('⚙️ 检测到旧版数据结构，做一次兼容处理');
      imageRow={data:{
        announcementImage:coreRow.data.announcementImage||'',
        noticeBg:coreRow.data.noticeBg||'',
        projectAreaBg:coreRow.data.projectAreaBg||'',
        yzPopupImage:coreRow.data.yzPopupImage||'',
        navIcons:coreRow.data.navIcons||{},
        bigIcons:coreRow.data.bigIcons||{},
        featureShots:coreRow.data.featureShots||{},
        projectImages:coreRow.data.projectImages||{},
        projectVideos:coreRow.data.projectVideos||{}
      }};
    }

    if(coreRow&&coreRow.data){
      var data=coreRow.data;
      if(data.allProjectsData)App.Storage.set('allProjectsData',data.allProjectsData);
      if(data.projectOrder)App.Storage.set('projectOrder',data.projectOrder);
      if(data.brandName)localStorage.setItem('brandName',data.brandName);
      if(data.noticeContent!==undefined)localStorage.setItem('noticeContent',data.noticeContent);
      if(data.shopContactLink)localStorage.setItem('shopContactLink',data.shopContactLink);
      if(data.downloadContactLink)localStorage.setItem('downloadContactLink',data.downloadContactLink);
      if(data.dynamicBgTheme)localStorage.setItem('dynamicBgTheme',data.dynamicBgTheme);
      if(data.cardTheme)localStorage.setItem('cardTheme',data.cardTheme);
      if(data.customCss!==undefined)localStorage.setItem('customCss',data.customCss);
      if(data.brandLogo!==undefined)localStorage.setItem('brandLogo',data.brandLogo);
      if(data.announcementData!==undefined)localStorage.setItem('announcementData',data.announcementData);
      if(data.colorMode)App.applyColorMode(data.colorMode);
      if(coreRow.updated_at)localStorage.setItem('cloud_updated_at',coreRow.updated_at);
      if(typeof coreRow.version==='number')localStorage.setItem('cloud_version',String(coreRow.version));
      localStorage.setItem('cloud_core_hash',_simpleHash(JSON.stringify(data)));
    }

    if(imageRow&&imageRow.data){
      await App.applyCloudImages(imageRow.data);
      localStorage.setItem('cloud_image_hash',_simpleHash(JSON.stringify(imageRow.data)));
    }

    localStorage.setItem('cloud_last_sync',String(Date.now()));
    if(!silent)App.updateCloudStatus('online');

    App.loadOrder();
    App.applyDynamicBg();
    App.applyCardTheme();
    App.applyCustomCss();
    App.loadBrandLogo();
    document.getElementById('brandText').textContent=App.getBrandName();
    App.renderNoticeContent();
    App.renderContactLinks();
    await App.preloadIcons();
    App.renderNav();
    return true;
  }catch(e){
    if(!silent){App.updateCloudStatus('offline');App.showToast('❌ 拉取异常',e.message)}
    return false;
  }
};

let _lastSeenVer=null,_realtimeStarted=false,_checking=0;
function startRealtime(){
  if(_realtimeStarted)return;
  if(!sbClient){console.warn('⚠️ 无 Realtime 客户端');return}
  // ★ 省额度：只有管理员才订阅 Realtime
  if(!isAdminMode){console.log('ℹ️ 非管理员，跳过 Realtime 订阅');return}
  try{
    sbClient.channel('yz_site_config_rt').on('postgres_changes',{event:'*',schema:'public',table:'site_config',filter:'id=eq.1'},function(payload){
      var ver=(payload&&payload.new&&payload.new.updated_at)||null;
      if(ver&&localStorage.getItem('cloud_updated_at')===ver)return;
      _lastSeenVer=ver;
      App.showRtToast('内容已实时更新');
      App.silentRefresh();
    }).subscribe(function(status){
      if(status==='SUBSCRIBED'){_realtimeStarted=true;App.updateCloudStatus('realtime')}
    });
  }catch(e){}
}
async function checkCloudUpdate(){
  if(document.visibilityState==='hidden')return;
  if(_checking)return;_checking=1;
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/site_config?id=eq.1&select=updated_at',{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},cache:'no-store'});
    if(!res.ok)return;
    var result=await res.json();
    var ver=result&&result[0]&&result[0].updated_at;
    if(!ver)return;
    if(_lastSeenVer===null){_lastSeenVer=ver;return}
    if(ver!==_lastSeenVer){
      _lastSeenVer=ver;
      if(localStorage.getItem('cloud_updated_at')===ver)return;
      App.showRtToast('内容已更新');
      App.silentRefresh();
    }
  }catch(e){}
  finally{_checking=0}
}

  }catch(e){}
  elements.appWrapper.classList.toggle('admin-mode',isAdminMode);
  document.getElementById('adminBadge').style.display=isAdminMode?'block':'none';
  document.getElementById('yzUploadWrap').style.display=isAdminMode?'inline-flex':'none';

};

App.openPasswordDialog=function(){App.closeAllOverlays();elements.pwdInput.value='';elements.pwdError.textContent='';elements.pwdOverlay.classList.add('active');document.body.style.overflow='hidden';setTimeout(function(){elements.pwdInput.focus()},100)};
App.closePasswordDialog=function(){elements.pwdOverlay.classList.remove('active');document.body.style.overflow=''};
function getLoginAttempts(){try{return JSON.parse(localStorage.getItem('login_attempts')||'{"count":0,"lockUntil":0}')}catch(e){return {count:0,lockUntil:0}}}
function setLoginAttempts(a){localStorage.setItem('login_attempts',JSON.stringify(a))}
App.verifyPassword=async function(){
  var input=elements.pwdInput.value.trim();
  if(!input){elements.pwdError.textContent='❌ 请输入密码';return}
  var att=getLoginAttempts();
  if(att.lockUntil&&Date.now()<att.lockUntil){var left=Math.ceil((att.lockUntil-Date.now())/1000);elements.pwdError.textContent='🚫 尝试过多，请 '+left+' 秒后重试';return}
  var stored=App.getPasswordHash();
  var res=await App.PwdCrypto.verify(input,stored);
  if(res.ok){
    if(res.upgraded&&res.newHash)App.setPasswordHash(res.newHash);
    setLoginAttempts({count:0,lockUntil:0});
    App.closePasswordDialog();
    App.setAdminMode(!isAdminMode);
    App.showToast(isAdminMode?'👑 管理员模式已开启':'🔒 已退出管理员模式',isAdminMode?'30 分钟有效':'管理功能已隐藏');
  }else{
    att.count=(att.count||0)+1;
    if(att.count>=5){att.lockUntil=Date.now()+5*60*1000;att.count=0}
    setLoginAttempts(att);
    var remain=5-att.count;
    elements.pwdError.textContent='❌ 密码错误'+(att.lockUntil?'（已锁定 5 分钟）':'，还可尝试 '+remain+' 次');
    elements.pwdInput.value='';elements.pwdInput.focus();
  }
};
App.openChangePwdDialog=function(){App.closeAllOverlays();document.getElementById('oldPwdInput').value='';document.getElementById('newPwdInput').value='';document.getElementById('confirmPwdInput').value='';document.getElementById('changePwdError').textContent='';elements.changePwdOverlay.classList.add('active');document.body.style.overflow='hidden';setTimeout(function(){document.getElementById('oldPwdInput').focus()},100)};
App.closeChangePwdDialog=function(){elements.changePwdOverlay.classList.remove('active');document.body.style.overflow=''};
App.changePassword=async function(){
  var op=document.getElementById('oldPwdInput').value.trim();
  var np=document.getElementById('newPwdInput').value.trim();
  var cp=document.getElementById('confirmPwdInput').value.trim();
  var err=document.getElementById('changePwdError');
  if(!op){err.textContent='❌ 请输入旧密码';return}
  if(!np){err.textContent='❌ 请输入新密码';return}
  if(np.length<8){err.textContent='❌ 新密码至少 8 位';return}
  if(np!==cp){err.textContent='❌ 两次输入不一致';return}
  var stored=App.getPasswordHash();
  var res=await App.PwdCrypto.verify(op,stored);
  if(!res.ok){err.textContent='❌ 旧密码错误';document.getElementById('oldPwdInput').value='';return}
  var nh=await App.PwdCrypto.hash(np);
  App.setPasswordHash(nh);
  App.closeChangePwdDialog();
  App.showToast('✅ 密码修改成功','已升级为 PBKDF2 加密');
};

App.saveGenericEdit=function(){
  var value=document.getElementById('genericEditValue').value.trim();
  switch(genericEditTarget){
    case 'brand':localStorage.setItem('brandName',value||'YZ官网');document.getElementById('brandText').textContent=value||'YZ官网';break;
    case 'notice':localStorage.setItem('noticeContent',value);App.renderNoticeContent();break;
    case 'shop':localStorage.setItem('shopContactLink',value||'#');App.renderContactLinks();break;
    case 'download':localStorage.setItem('downloadContactLink',value||'#');App.renderContactLinks();break;
    case 'customCss':localStorage.setItem('customCss',value);App.applyCustomCss();break;
    case 'announcement':
      try{var d=JSON.parse(value);if(d&&typeof d==='object')App.saveAnnouncement({title:d.title||'公告',body:d.body||''});else App.saveAnnouncement({title:'公告',body:String(value)})}
      catch(e){App.saveAnnouncement({title:'公告',body:String(value)})}
      if(genericEditAnnouncementImageData)App.setAnnouncementImage(genericEditAnnouncementImageData);
      else App.removeAnnouncementImage();

};

App.renderNav=function(){
  var allKeys=Object.keys(App.getAllProjectsData());
  var fk=searchQuery?allKeys.filter(function(k){var d=App.getProjectData(k);return d&&(d.name.toLowerCase().indexOf(searchQuery.toLowerCase())!==-1||(d.subtitle||'').toLowerCase().indexOf(searchQuery.toLowerCase())!==-1||(d.tags||[]).some(function(t){return t.toLowerCase().indexOf(searchQuery.toLowerCase())!==-1}))}):allKeys;
  var ordered=[];
  projectOrder.forEach(function(k){if(fk.indexOf(k)!==-1)ordered.push(k)});
  fk.forEach(function(k){if(ordered.indexOf(k)===-1)ordered.push(k)});
  projectOrder=ordered;
  if(projectOrder.indexOf(currentKey)===-1)currentKey=projectOrder[0]||'';
  var navContainer=elements.projectNav;
  var existing={};
  Array.prototype.slice.call(navContainer.children).forEach(function(el){if(el.dataset.project)existing[el.dataset.project]=el});
  Array.prototype.slice.call(navContainer.querySelectorAll('.add-btn')).forEach(function(el){el.remove()});
  var fragment=document.createDocumentFragment();
  var newKeys=[];
  for(var i=0;i<projectOrder.length;i++){
    var key=projectOrder[i];
    var data=App.getProjectData(key);
    if(!data)continue;
    if(!isAdminMode&&data.enabled===false)continue;
    newKeys.push(key);
    var div=existing[key];
    if(!div){div=document.createElement('div');div.className='nav-item';div.dataset.project=key;div.innerHTML='<span class="nav-icon-wrap"></span><span></span>'}
    div.classList.toggle('active',key===currentKey);
    var isTouch='ontouchstart'in window||navigator.maxTouchPoints>0;
    div.draggable=isAdminMode&&!isTouch;
    var iw=div.querySelector('.nav-icon-wrap');
    var di=App.getProjectIconHtml(key);
    if(iw.dataset.curIcon!==di){iw.innerHTML=di+(isAdminMode?'<button class="nav-icon-upload-btn" data-project="'+key+'" title="上传图标"><i class="fas fa-camera"></i><input type="file" accept="image/*" data-project="'+key+'"/></button>':'');iw.dataset.curIcon=di}
    var sp=div.querySelector('span:last-child');
    var db=data.enabled===false?'<span class="disabled-badge">🔒</span>':'';
    if(sp.dataset.nm!==data.name+db){sp.innerHTML=App.escapeHtml(data.name)+db;sp.dataset.nm=data.name+db}
    fragment.appendChild(div);
  }
  Object.keys(existing).forEach(function(k){if(newKeys.indexOf(k)===-1&&existing[k].parentNode)existing[k].remove()});
  if(isAdminMode){var ab=document.createElement('div');ab.className='nav-item add-btn';ab.innerHTML='<i class="fas fa-plus"></i><span>添加项目</span>';fragment.appendChild(ab)}
  navContainer.innerHTML='';
  navContainer.appendChild(fragment);
  if(!currentKey){elements.cardContainer.innerHTML='<p style="text-align:center;color:var(--text-muted);padding:30px 0;">暂无项目</p>';return}
  App.renderCard();
};

    });

  '<div class="card-name-tier3">'+safeName+' <span class="highlight">'+App.escapeHtml(data.subtitle||'')+'</span></div>'+
  infoHtml+

  document.getElementById('featureShotTitle').textContent=title;
  var body=document.getElementById('featureShotBody');

App.renderAdminPanel=function(){
  var container=elements.cardContainer;
  var html='<div class="admin-panel" style="padding: 4px 0;"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:6px;"><span style="color:var(--text-muted); font-size:12px;"><i class="fas fa-database"></i> 共 '+projectOrder.length+' 个项目</span><button class="tool-btn" data-action="add-project" style="background:rgba(212,175,55,0.12); border:1px solid rgba(212,175,55,0.2); padding:4px 14px; border-radius:var(--radius-full); color:#f5d98a; cursor:pointer; font-size:12px;"><i class="fas fa-plus"></i> 添加项目</button></div><div style="display:flex; flex-direction:column; gap:4px;">';
  for(var i=0;i<projectOrder.length;i++){
    var key=projectOrder[i];
    var data=App.getProjectData(key);
    if(!data)continue;
    var isActive=key===currentKey;
    var st=data.enabled!==false?'🟢 启用':'🔴 禁用';
    var ih=App.getProjectIconHtml(key);
    var ub='<button class="nav-icon-upload-btn" data-project="'+key+'" title="上传图标"><i class="fas fa-camera"></i><input type="file" accept="image/*" data-project="'+key+'"/></button>';
    var pv=App.Stats.getProjectViews(key),dl=App.Stats.getProjectDownloads(key);
    var bc=(data.cardButtons&&Array.isArray(data.cardButtons))?data.cardButtons.length:0;
    var fc=(data.features&&Array.isArray(data.features))?data.features.length:0;
    var cc=(data.changelog&&Array.isArray(data.changelog))?data.changelog.length:0;
    html+='<div class="admin-item" data-key="'+key+'" style="border-color:'+(isActive?'rgba(212,175,55,0.2)':'var(--border-subtle)')+'"><div class="item-left"><span class="nav-icon-wrap">'+ih+ub+'</span><span class="item-name">'+App.escapeHtml(data.name)+'</span><span class="item-status">'+st+'</span><span style="font-size:8px;color:var(--text-muted);">👁'+pv+' ⬇'+dl+' 🔘'+bc+' ✨'+fc+' 📜'+cc+'</span></div><div class="item-actions"><button class="edit-btn" data-action="edit" data-key="'+key+'">✏️</button><button class="toggle-btn" data-action="toggle" data-key="'+key+'">'+(data.enabled!==false?'🔒':'🔓')+'</button><button class="move-btn" data-action="move-up" data-key="'+key+'" '+(projectOrder.indexOf(key)<=0?'disabled':'')+'>↑</button><button class="move-btn" data-action="move-down" data-key="'+key+'" '+(projectOrder.indexOf(key)>=projectOrder.length-1?'disabled':'')+'>↓</button><button class="del-btn" data-action="delete" data-key="'+key+'">🗑️</button></div></div>';
  }
  html+='</div></div>';
  container.innerHTML=html;
  container.querySelectorAll('.admin-item .item-actions button').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var action=btn.dataset.action,key=btn.dataset.key;
      if(!key)return;
      switch(action){
        case 'edit':App.openLinkEditor(key);break;
        case 'toggle':var d=App.getProjectData(key);App.updateProjectData(key,{enabled:d.enabled===false});App.renderNav();App.renderAdminPanel();break;
        case 'move-up':App.moveProject(key,-1);App.renderAdminPanel();break;
        case 'move-down':App.moveProject(key,1);App.renderAdminPanel();break;
        case 'delete':
          if(projectOrder.length<=1){App.showToast('⚠️ 至少保留一个项目');return}
          App.deleteProjectWithUndo(key);
          break;
      }
    });
  });
  container.querySelectorAll('.nav-icon-upload-btn input[type="file"]').forEach(function(input){
    input.addEventListener('change',async function(){var f=this.files[0];if(!f)return;App.showToast('⏳ 上传...');var pk=this.dataset.project;var url=await App.uploadToStorage(f,'nav_icon');if(url){await App.setNavIcon(pk,url);App.renderNav();App.renderAdminPanel();App.showToast('✅ 已更新')}this.value=''});
  });
  container.querySelectorAll('.nav-icon-wrap').forEach(function(wrap){
    wrap.addEventListener('contextmenu',function(e){e.preventDefault();var item=this.closest('.admin-item');if(!item)return;var key=item.dataset.key;if(navIconCache[key]){App.openConfirmDialog('确定移除图标吗？',function(){App.removeNavIcon(key);App.renderNav();App.renderAdminPanel();App.showToast('🗑️ 已移除')})}});
  });
};

App.deleteProjectWithUndo=function(key){
  var data=App.getProjectData(key);
  if(!data)return;
  var allBackup=JSON.parse(JSON.stringify(App.getAllProjectsData()));
  var orderIdx=projectOrder.indexOf(key);
  App.deleteProjectData(key);
  App.removeProjectImage(key);App.removeProjectVideo(key);App.removeNavIcon(key);App.removeBigIcon(key);
  projectOrder=projectOrder.filter(function(k){return k!==key});
  if(currentKey===key)currentKey=projectOrder[0]||'';
  App.renderNav();
  App.showUndo('已删除「'+data.name+'」',function(){
    App.saveAllProjectsData(allBackup);
    if(orderIdx>=0)projectOrder.splice(orderIdx,0,key);
    else projectOrder.push(key);
    currentKey=key;
    App.saveOrder();
    App.renderNav();
    App.showToast('↩️ 已撤销删除');
  },5);
};

/* ★ 图片上传：更小尺寸 + 长缓存 */
App.uploadToStorage=async function(file,folder){
  folder=folder||'uploads';
  try{
    const maxSize=900;
    const quality=0.78;
    const compressedBlob=await new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement('canvas');
          var w=img.width,h=img.height;
          var ratio=maxSize/Math.max(w,h);
          if(ratio<1){w*=ratio;h*=ratio}
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error('转换失败'))},'image/webp',quality);
        };
        img.onerror=reject;img.src=e.target.result;
      };
      reader.onerror=reject;reader.readAsDataURL(file);
    });
    var fileName=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.webp';
    var filePath=folder+'/'+fileName;
    var response=await fetch(SUPABASE_URL+'/storage/v1/object/images/'+filePath,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'image/webp','cache-control':'public, max-age=31536000, immutable'},
      body:compressedBlob
    });
    if(!response.ok)throw new Error('上传失败');
    return SUPABASE_URL+'/storage/v1/object/public/images/'+filePath+'?v='+Date.now();
  }catch(e){
    console.error('图片上传失败:',e);
    App.showToast('❌ 上传失败',e.message);
    return null;
  }
};

App.CacheCleaner={
_lsSize:function(){var t=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k)continue;var v=localStorage.getItem(k);if(v)t+=(k.length+v.length)*2}}catch(e){}return t},
_formatSize:function(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(2)+' KB';return (b/1048576).toFixed(2)+' MB'},
_validLocalKeys:function(){return['allProjectsData','projectOrder','brandName','noticeContent','shopContactLink','downloadContactLink','dynamicBgTheme','cardTheme','customCss','brandLogo','announcementData','adminPasswordHash','cloud_last_sync','cloud_updated_at','cache_last_clean','colorMode','stats_summary_cache','login_attempts','cloud_version','cloud_core_hash','cloud_image_hash']},
cleanExpiredStats:function(){var removed=0;var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);var cs=cutoff.toISOString().split('T')[0];var tr=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||k.indexOf('stats_')!==0)continue;var m=k.match(/_(\d{4}-\d{2}-\d{2})$/);if(m&&m[1]<cs)tr.push(k)}tr.forEach(function(k){localStorage.removeItem(k)});removed=tr.length}catch(e){}return removed},
cleanJunkLocalKeys:function(){var removed=0;var valid=this._validLocalKeys();var tr=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k)continue;if(k.indexOf('stats_')===0)continue;if(k.indexOf('yz_db_')===0)continue;if(valid.indexOf(k)!==-1)continue;tr.push(k)}tr.forEach(function(k){localStorage.removeItem(k)});removed=tr.length}catch(e){}return removed},
cleanEmptyLocalKeys:function(){var removed=0;var valid=this._validLocalKeys();var tr=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k)continue;var v=localStorage.getItem(k);if(v!==null&&v!=='')continue;if(valid.indexOf(k)!==-1)continue;if(k.indexOf('stats_')===0)continue;tr.push(k)}tr.forEach(function(k){localStorage.removeItem(k)});removed=tr.length}catch(e){}return removed},
cleanOrphanDBImages:async function(){var all=App.getAllProjectsData();var valid={};Object.keys(all).forEach(function(k){valid[k]=1;valid['bigicon_'+k]=1;var fs=all[k].features||[];fs.forEach(function(f){if(f&&f.fid)valid['feature_shot_'+f.fid]=1})});valid['announcement_img']=1;valid['notice_bg']=1;valid['project_area_bg']=1;valid['yz_popup']=1;var items=await App.getAllFromStore('images');var orphans=[],freed=0;Object.keys(items).forEach(function(key){if(!valid[key]){var v=items[key];if(v&&typeof v==='string')freed+=v.length*2;orphans.push(key)}});for(var i=0;i<orphans.length;i++){await App.deleteFromDB('images',orphans[i]);delete imageCache[orphans[i]];if(orphans[i].indexOf('bigicon_')===0)delete bigIconCache[orphans[i].replace('bigicon_','')];if(orphans[i].indexOf('feature_shot_')===0)delete featureShotCache[orphans[i].replace('feature_shot_','')]}return{count:orphans.length,freed:freed}},
cleanOrphanNavIcons:async function(){var all=App.getAllProjectsData();var valid={};Object.keys(all).forEach(function(k){valid[k]=1});var items=await App.getAllFromStore('navIcons');var orphans=[],freed=0;Object.keys(items).forEach(function(key){if(!valid[key]){var v=items[key];if(v&&typeof v==='string')freed+=v.length*2;orphans.push(key)}});for(var i=0;i<orphans.length;i++){await App.deleteFromDB('navIcons',orphans[i]);delete navIconCache[orphans[i]]}return{count:orphans.length,freed:freed}},
cleanOrphanVideos:async function(){var all=App.getAllProjectsData();var valid={};Object.keys(all).forEach(function(k){valid[k]=1});var items=await App.getAllFromStore('videos');var orphans=[],freed=0;Object.keys(items).forEach(function(key){if(!valid[key]){var v=items[key];if(v&&typeof v==='string')freed+=v.length*2;orphans.push(key)}});for(var i=0;i<orphans.length;i++){await App.deleteFromDB('videos',orphans[i]);delete videoCache[orphans[i]]}return{count:orphans.length,freed:freed}},
run:async function(silent){
  silent=!!silent;
  var beforeLS=this._lsSize();
  var result={expiredStats:0,junkKeys:0,emptyKeys:0,orphanImages:0,orphanNavIcons:0,orphanVideos:0,freedBytes:0};
  try{
    result.expiredStats=this.cleanExpiredStats();
    result.junkKeys=this.cleanJunkLocalKeys();
    result.emptyKeys=this.cleanEmptyLocalKeys();
    var iR=await this.cleanOrphanDBImages();result.orphanImages=iR.count;
    var nR=await this.cleanOrphanNavIcons();result.orphanNavIcons=nR.count;
    var vR=await this.cleanOrphanVideos();result.orphanVideos=vR.count;
    var afterLS=this._lsSize();
    result.freedBytes=Math.max(0,beforeLS-afterLS)+iR.freed+nR.freed+vR.freed;
    localStorage.setItem('cache_last_clean',String(Date.now()));
    var total=result.expiredStats+result.junkKeys+result.emptyKeys+result.orphanImages+result.orphanNavIcons+result.orphanVideos;
    if(!silent){if(total>0)App.showToast('🧹 清理完成','共 '+total+' 项 · 释放 '+this._formatSize(result.freedBytes));else App.showToast('✨ 缓存很干净','当前占用 '+this._formatSize(this._lsSize()))}
    return result;
  }catch(e){if(!silent)App.showToast('❌ 清理失败',e.message);return result}
},
autoRun:function(){var last=parseInt(localStorage.getItem('cache_last_clean')||'0',10);if(Date.now()-last<86400000)return;setTimeout(function(){App.CacheCleaner.run(true)},8000)}
};

  (function(){var all=App.getAllProjectsData();var changed=false;Object.keys(all).forEach(function(key){var d=all[key];if(d.cardButtons&&Array.isArray(d.cardButtons)){d.cardButtons.forEach(function(b){if(b.type==='download'&&(!b.link||b.link==='#')&&d.downloadLink&&d.downloadLink!=='#'){b.link=d.downloadLink;changed=true}if(b.type==='channel'&&(!b.link||b.link==='#')&&d.channelLink&&d.channelLink!=='#'){b.link=d.channelLink;changed=true}if(b.type==='group'&&(!b.link||b.link==='#')&&d.groupLink&&d.groupLink!=='#'){b.link=d.groupLink;changed=true}})}if(!d.features||!Array.isArray(d.features)){d.features=JSON.parse(JSON.stringify(DEFAULT_FEATURES));changed=true}if(!d.changelog||!Array.isArray(d.changelog)){d.changelog=JSON.parse(JSON.stringify(DEFAULT_CHANGELOG));changed=true}});if(changed)App.saveAllProjectsData(all)})();

  App.openDB().then(async function(){

    await App.preloadIcons();
    App.setAdminMode(isAdminMode);
    if(yzPopupImage)document.getElementById('yzRemoveBtn').classList.add('show');
    App.renderNav();
    App.Stats.updateUI();
    if(CLOUD_ENABLED){
      App.updateCloudStatus('online');

        var r0=await fetch(SUPABASE_URL+'/rest/v1/site_config?id=eq.1&select=updated_at',{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},cache:'no-store'});
        if(r0.ok){var rr=await r0.json();if(rr&&rr[0]&&rr[0].updated_at)_lastSeenVer=rr[0].updated_at}
      }catch(e){}
    }
    startRealtime();
    setInterval(checkCloudUpdate,60000); // ★ 60s
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkCloudUpdate()});
    App.CacheCleaner.autoRun();
  });
};
